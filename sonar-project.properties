# ==============================================================================
# SonarQube / SonarCloud Configuration - Milton H Flores Chino
# ==============================================================================

sonar.projectName=BetSport Pro - Plataforma de Apuestas Deportivas
sonar.projectVersion=1.0.0

sonar.sources=app,lib,server.cjs,scripts
sonar.tests=tests
sonar.exclusions=node_modules/**,.next/**,coverage/**,terraform/**,docs/**

sonar.sourceEncoding=UTF-8
sonar.javascript.environments=nodejs,browser
sonar.typescript.tsconfigPath=tsconfig.json

# El workflow verifica además métricas globales con check-sonar.cjs
sonar.qualitygate.wait=true

sonar.javascript.lcov.reportPaths=coverage/lcov.info
